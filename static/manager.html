<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记账管理 · BillAnaly</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .container { max-width: 1380px; margin: 0 auto; }
        .card h2 { margin: 0; font-size: 14px; font-weight: 600; color: #0F172A; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; align-items: end; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 11px; color: #64748b; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
        .form-group input, .form-group select {
            padding: 7px 9px; border: 1px solid #E2E8F0; border-radius: 6px;
            font-size: 13px; outline: none; font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #635BFF;
            box-shadow: 0 0 0 3px rgba(99,91,255,0.12);
        }

        .btn-add    { background: #635BFF; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; font-weight: 600; cursor: pointer; height: 35px; font-family: inherit; }
        .btn-add:hover { background: #4F46E5; }
        .btn-filter { background: #0F172A; color: #fff; border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; height: 35px; font-family: inherit; }
        .btn-filter:hover { background: #1E293B; }
        .btn-reset  { background: #F1F5F9; color: #475569; border: 1px solid #E2E8F0; padding: 7px 12px; border-radius: 6px; cursor: pointer; height: 35px; font-family: inherit; }
        .btn-reset:hover { background: #E2E8F0; }
        .btn-export { background: #10B981; color: #fff; border: none; padding: 7px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; height: 35px; font-family: inherit; }
        .btn-export:hover { background: #059669; }

        .table-responsive { overflow-x: auto; max-height: 600px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th, td { padding: 8px 10px; border-bottom: 1px solid #E2E8F0; white-space: nowrap; }
        th { background: #F8FAFC; color: #64748B; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; position: sticky; top: 0; z-index: 10; }
        tr:hover td { background-color: #F8FAFC; }
        tr:hover td:first-child { box-shadow: inset 2px 0 0 #635BFF; }

        .sortable-th { cursor: pointer; user-select: none; }
        .sortable-th:hover { color: #635BFF; background-color: #EEF2FF; }

        .editable-cell { cursor: pointer; border-radius: 4px; padding: 3px 5px; transition: background 0.15s; }
        .editable-cell:hover { background-color: #EEF2FF; outline: 1px dashed #635BFF; }
        .cell-input { width: 100%; padding: 4px; font-size: 12px; border: 1px solid #635BFF; border-radius: 4px; font-family: inherit; }

        .btn-action { border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 4px; font-family: inherit; }
        .btn-del { background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; }
        .btn-del:hover { background: #FEE2E2; }

        .badge-type { display: inline-block; padding: 2px 7px; border-radius: 9999px; font-size: 11px; font-weight: 700; }
        .type-EX { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }
        .type-IN { background: #ECFDF5; color: #166534; border: 1px solid #A7F3D0; }
        .type-AP { background: #EFF6FF; color: #075985; border: 1px solid #BFDBFE; }
        .type-AR { background: #FFFBEB; color: #92400E; border: 1px solid #FDE68A; }
        .type-TR { background: #EEF2FF; color: #4338CA; border: 1px solid #C7D2FE; }

        /* 语音按钮 */
        .fab-voice {
            position: fixed; bottom: 24px; right: 24px;
            width: 52px; height: 52px;
            border-radius: 50%;
            background: #635BFF;
            color: #fff;
            border: none;
            box-shadow: 0 4px 14px rgba(99,91,255,0.4);
            font-size: 22px;
            cursor: pointer;
            z-index: 999;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .fab-voice:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(99,91,255,0.5);
        }
    </style>
</head>
<body>
    <!-- 统一顶部导航 -->
    <nav class="topbar">
        <a href="/dashboard.html" class="topbar-brand">💎 BillAnaly</a>
        <div class="topbar-nav">
            <a href="/dashboard.html">仪表盘</a>
            <a href="/manager.html" class="active">记账管理</a>
            <a href="/account.html">账号</a>
            <a href="/logs.html" id="nav-logs" style="display:none;">日志</a>
        </div>
        <div class="topbar-actions">
            <button class="btn-danger btn-sm" onclick="logout()">退出登录</button>
        </div>
    </nav>

<div class="container">
    <!-- 1. 新增记账条目 -->
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px;">
            <h2>➕ 录入账单条目</h2>
        </div>
        <form id="expense-form">
            <div class="form-grid">
                <div class="form-group">
                    <label>日期</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group" style="max-width: 90px;">
                    <label>时间</label>
                    <input type="text" id="time" placeholder="如 12:30">
                </div>
                <div class="form-group">
                    <label>交易类型</label>
                    <select id="type">
                        <option value="EX" selected>支出（EX）</option>
                        <option value="IN">收入（IN）</option>
                        <option value="AP">收回（AP）</option>
                        <option value="AR">垫付（AR）</option>
                        <option value="TR">转移（TR）</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <input type="text" id="category" placeholder="如 饮食 / 交通" required>
                </div>
                <div class="form-group">
                    <label>品名</label>
                    <input type="text" id="name" placeholder="如 农夫山泉.5L" required>
                </div>
                <div class="form-group" style="max-width: 100px;">
                    <label>金额 (元)</label>
                    <input type="number" step="0.01" id="amount" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label>源账户</label>
                    <input list="account-options" id="pay_acc" placeholder="选择或手打输入" value="微信（VX）">
                    <datalist id="account-options">
                        <option value="支付宝（AL）"></option>
                        <option value="微信（VX）"></option>
                        <option value="银行卡（BK）"></option>
                        <option value="交通卡（TC）"></option>
                        <option value="花呗（HB）"></option>
                    </datalist>
                </div>
                <div class="form-group">
                    <label>目标账户</label>
                    <input type="text" id="merchant" placeholder="如 优特卖 / 商家名">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input type="text" id="remark" placeholder="补充说明或代金券备注">
                </div>
                <button type="submit" class="btn-add">提交记录</button>
            </div>
        </form>
    </div>

    <!-- 2. 多维筛选与排序工具栏 -->
    <div class="card" style="padding: 14px 18px;">
        <div class="form-grid" style="margin-bottom: 10px;">
            <div class="form-group">
                <label>开始日期</label>
                <input type="date" id="filter-start">
            </div>
            <div class="form-group">
                <label>结束日期</label>
                <input type="date" id="filter-end">
            </div>
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <label style="margin-bottom: 0;">消费分类</label>
                    <label style="font-size: 11px; color: #635BFF; cursor: pointer; display: flex; align-items: center; gap: 3px; text-transform: none; letter-spacing: 0;">
                        <input type="checkbox" id="filter-exact" onchange="loadData()"> 精确
                    </label>
                </div>
                <input type="text" id="filter-category" placeholder="按分类搜索...">
            </div>
            <div class="form-group">
                <label>品名搜索</label>
                <input type="text" id="filter-name" placeholder="包含关键字...">
            </div>
            <div class="form-group">
                <label>交易类型</label>
                <select id="filter-type">
                    <option value="">全部类型</option>
                    <option value="EX">支出（EX）</option>
                    <option value="IN">收入（IN）</option>
                    <option value="AP">收回（AP）</option>
                    <option value="AR">垫付（AR）</option>
                    <option value="TR">转移（TR）</option>
                </select>
            </div>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label>源账户</label>
                <select id="filter-account">
                    <option value="">全部源账户</option>
                    <option value="AL">支付宝（AL）</option>
                    <option value="VX">微信（VX）</option>
                    <option value="BK">银行卡（BK）</option>
                    <option value="TC">交通卡（TC）</option>
                    <option value="HB">花呗（HB）</option>
                </select>
            </div>
            <div class="form-group">
                <label>目标账户/商户</label>
                <input type="text" id="filter-merchant" placeholder="如 优特卖 / 麦当劳">
            </div>
            <div class="form-group">
                <label>金额范围 (最小~最大)</label>
                <div style="display: flex; gap: 4px; align-items: center;">
                    <input type="number" step="0.01" id="filter-min-amount" placeholder="¥ 最小" style="width: 50%;">
                    <span style="color:#94a3b8;">-</span>
                    <input type="number" step="0.01" id="filter-max-amount" placeholder="¥ 最大" style="width: 50%;">
                </div>
            </div>
            <div class="form-group" style="max-width: 140px;">
                <label>时间排序</label>
                <select id="sort-order" onchange="loadData()">
                    <option value="desc" selected>时间逆序 (最新在上)</option>
                    <option value="asc">时间顺序 (最早在上)</option>
                </select>
            </div>
            <div style="display:flex; gap:8px; align-items: flex-end;">
                <button type="button" class="btn-filter" onclick="loadData()">🔍 筛选</button>
                <button type="button" class="btn-reset" onclick="resetFilter()">重置</button>
                <button type="button" class="btn-export" onclick="exportToExcel()">📥 导出 Excel</button>
            </div>
        </div>
    </div>

    <!-- 3. 数据表格 -->
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
            <h2>📑 账单明细列表 (<span id="total-count">0</span> 条)</h2>
            <span style="font-size:12px; color:#94A3B8;">💡 点击表头"日期"可快速切换升降序；双击单元格可修改数值</span>
        </div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;">ID</th>
                        <th class="sortable-th" onclick="toggleSort()">日期 <span id="sort-indicator">↓</span></th>
                        <th>时间</th>
                        <th>交易类型</th>
                        <th>分类</th>
                        <th>品名</th>
                        <th>金额</th>
                        <th>源账户</th>
                        <th>目标账户</th>
                        <th>备注</th>
                        <th style="width: 80px;">操作</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 语音智能记账悬浮按钮 -->
<button class="fab-voice" onclick="triggerVoiceAssistant()" title="AI 语音智能记账">🎤</button>

<script src="auth.js"></script>
<script src="manager.js"></script>
<script>
    // 初始化导航状态
    (async () => {
        try {
            const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
            if (res.ok) {
                const me = await res.json();
                if (me.role === 'admin') {
                    document.getElementById('nav-logs').style.display = 'inline-block';
                }
            }
        } catch (e) {}
    })();

    function logout() {
        fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' })
            .finally(() => window.location.replace('/login.html'));
    }

    async function triggerVoiceAssistant() {
        if ('webkitSpeechRecognition' in window) {
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'zh-CN';
            alert("请开始说话（例如：今天在全家买饭团可乐花了18元用微信付的）...");
            recognition.start();
            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                sendToAiParse(transcript);
            };
        } else {
            const text = prompt("请输入你的记账口语（支持智能识别）：");
            if (text) sendToAiParse(text);
        }
    }

    async function sendToAiParse(text) {
        const res = await fetch('/api/ai/parse_expense', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
        });
        if (res.ok) {
            const item = await res.json();
            document.getElementById('date').value = item.日期;
            document.getElementById('time').value = item.时间 || '12:00';
            document.getElementById('type').value = item.交易类型;
            document.getElementById('category').value = item.分类;
            document.getElementById('name').value = item.品名;
            document.getElementById('amount').value = item.实际金额;
            document.getElementById('pay_acc').value = item.支付账户;
            document.getElementById('merchant').value = item.目标账户;
            document.getElementById('remark').value = item.备注;
            alert("AI 已自动提取信息并填入表单，请核对后提交！");
        }
    }
</script>
</body>
</html>
