<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · BillAnaly</title>
    <link rel="icon" href="favicon.ico">
    <style>
        @import url("tokens.css");
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont,
                         "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #EEF2FF 0%, #F8FAFC 55%, #E0E7FF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #334155;
            min-height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #E2E8F0;
            box-shadow: 0 20px 40px rgba(99,91,255,0.08), 0 4px 12px rgba(15,23,42,0.06);
            padding: 36px 32px 30px;
        }
        .brand {
            text-align: center;
            margin-bottom: 28px;
        }
        .brand .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #635BFF, #818CF8);
            border-radius: 14px;
            font-size: 24px;
            margin-bottom: 14px;
            box-shadow: 0 4px 12px rgba(99,91,255,0.3);
        }
        .brand h1 {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 6px;
            color: #0F172A;
            letter-spacing: -0.3px;
        }
        .brand p {
            font-size: 12.5px;
            color: #94A3B8;
            margin: 0;
        }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #64748B;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .form-group input {
            width: 100%;
            padding: 11px 13px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            outline: none;
            color: #0F172A;
            background: #FAFAFA;
            transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        }
        .form-group input:focus {
            border-color: #635BFF;
            box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.12);
            background: #fff;
        }
        .btn-login {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            background: #635BFF;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            letter-spacing: 0.2px;
        }
        .btn-login:hover  { background: #4F46E5; }
        .btn-login:active { transform: scale(0.99); }
        .btn-login:disabled { background: #A5B4FC; cursor: not-allowed; }
        .msg {
            display: none;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }
        .msg.error { display: block; background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; }
        .msg.ok    { display: block; background: #ECFDF5; color: #15803D; border: 1px solid #A7F3D0; }
        .hint {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #F1F5F9;
            font-size: 12px;
            color: #94A3B8;
            line-height: 1.6;
            text-align: center;
        }
    
        /* 深色模式适配 */
        [data-theme="dark"] body {
            background: linear-gradient(135deg, #0F172A 0%, #0B0F19 55%, #1E1B4B 100%) !important;
            color: #F8FAFC !important;
        }
        [data-theme="dark"] .login-card {
            background: #111827 !important;
            border-color: #1F2937 !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 4px 12px rgba(0,0,0,0.4) !important;
        }
        [data-theme="dark"] .brand h1 {
            color: #F8FAFC !important;
        }
        [data-theme="dark"] .form-group input {
            background: #0B0F19 !important;
            border-color: #1F2937 !important;
            color: #FFFFFF !important;
        }
        [data-theme="dark"] .hint {
            border-top-color: #1F2937 !important;
        }
    </style>
</head>
<body>
    <!-- 主题切换按钮 -->
    <button class="btn-ghost btn-sm btn-theme-toggle" onclick="toggleTheme()" id="btn-theme-toggle" title="切换深色/浅色模式" style="position:fixed; top:20px; right:20px; border-radius:9999px; z-index:100; font-size:16px; padding:7px 12px; background:var(--color-surface); box-shadow:var(--shadow-sm);">🌙</button>

<div class="login-card">
    <div class="brand">
        <div class="logo">💎</div>
        <h1>BillAnaly</h1>
        <p>个人财务行为分析系统</p>
    </div>

    <form id="login-form" autocomplete="on">
        <div class="form-group">
            <label for="username">账号</label>
            <input type="text" id="username" name="username" placeholder="请输入账号"
                   autocomplete="username" autofocus required>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" placeholder="请输入密码"
                   autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login" id="btn-submit">登 录</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="hint">
        账号由管理员统一创建分配<br>
        忘记密码请联系管理员重置
    </div>
</div>

<script>
    const form = document.getElementById('login-form');
    const msgBox = document.getElementById('msg');
    const btn = document.getElementById('btn-submit');

    const params = new URLSearchParams(window.location.search);
    const nextUrl = params.get('next');

    function showMsg(text, type = 'error') {
        msgBox.className = 'msg ' + type;
        msgBox.textContent = text;
    }

    function safeNext() {
        if (!nextUrl) return '/dashboard.html';
        if (!nextUrl.startsWith('/') || nextUrl.startsWith('//')) return '/dashboard.html';
        if (nextUrl.startsWith('/login.html')) return '/dashboard.html';
        return nextUrl;
    }

    (async () => {
        try {
            const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
            if (res.ok) window.location.replace(safeNext());
        } catch (e) { /* 未登录，正常停留 */ }
    })();

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
            showMsg('请输入账号和密码');
            return;
        }

        btn.disabled = true;
        btn.textContent = '登录中...';
        msgBox.className = 'msg';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ username, password })
            });

            if (res.ok) {
                const data = await res.json();
                showMsg(`欢迎回来，${data.username}！正在进入系统...`, 'ok');
                window.location.replace(safeNext());
                return;
            }

            let detail = '登录失败，请重试';
            try {
                const err = await res.json();
                if (err && err.detail) detail = err.detail;
            } catch (e) { /* 忽略 */ }
            showMsg(detail);
        } catch (err) {
            showMsg('网络异常，无法连接服务器，请稍后重试');
        } finally {
            btn.disabled = false;
            btn.textContent = '登 录';
        }
    });
</script>
</body>
</html>
