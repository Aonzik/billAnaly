<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 智能个人财务分析系统</title>
    <link rel="icon" href="favicon.ico">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 55%, #1e3a8a 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 24px; color: #334155;
        }
        .login-card {
            width: 100%; max-width: 380px;
            background: #fff; border-radius: 14px;
            box-shadow: 0 18px 50px rgba(2, 6, 23, 0.45);
            padding: 34px 30px 28px;
        }
        .brand { text-align: center; margin-bottom: 26px; }
        .brand .logo { font-size: 40px; line-height: 1; }
        .brand h1 { font-size: 19px; margin: 12px 0 6px; color: #0f172a; }
        .brand p { font-size: 12.5px; color: #94a3b8; margin: 0; }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block; font-size: 12.5px; font-weight: 600;
            color: #64748b; margin-bottom: 6px;
        }
        .form-group input {
            width: 100%; padding: 11px 13px; font-size: 14px;
            border: 1px solid #cbd5e1; border-radius: 8px; outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .btn-login {
            width: 100%; margin-top: 8px; padding: 12px;
            background: #2563eb; color: #fff; font-size: 15px; font-weight: 700;
            border: none; border-radius: 8px; cursor: pointer;
            transition: background 0.15s;
        }
        .btn-login:hover { background: #1d4ed8; }
        .btn-login:disabled { background: #93c5fd; cursor: not-allowed; }
        .msg {
            display: none; margin-top: 14px; padding: 10px 12px;
            border-radius: 8px; font-size: 13px; line-height: 1.5;
        }
        .msg.error { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .msg.ok { display: block; background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
        .hint {
            margin-top: 22px; padding-top: 16px; border-top: 1px dashed #e2e8f0;
            font-size: 12px; color: #94a3b8; line-height: 1.6; text-align: center;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="brand">
        <div class="logo">💰</div>
        <h1>智能个人财务分析系统</h1>
        <p>请登录后使用，未登录无法查看任何页面</p>
    </div>

    <form id="login-form" autocomplete="on">
        <div class="form-group">
            <label for="username">账号</label>
            <input type="text" id="username" name="username" placeholder="请输入账号"
                   autocomplete="username" autofocus required>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" placeholder="请输入密码"
                   autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login" id="btn-submit">登 录</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="hint">
        账号由管理员统一创建分配<br>
        忘记密码请联系管理员重置
    </div>
</div>

<script>
    const form = document.getElementById('login-form');
    const msgBox = document.getElementById('msg');
    const btn = document.getElementById('btn-submit');

    // 支持 ?next=/manager.html 登录后回跳原目标页面
    const params = new URLSearchParams(window.location.search);
    const nextUrl = params.get('next');

    function showMsg(text, type = 'error') {
        msgBox.className = 'msg ' + type;
        msgBox.textContent = text;
    }

    function safeNext() {
        // 仅允许站内相对路径，防止开放重定向
        if (!nextUrl) return '/dashboard.html';
        if (!nextUrl.startsWith('/') || nextUrl.startsWith('//')) return '/dashboard.html';
        if (nextUrl.startsWith('/login.html')) return '/dashboard.html';
        return nextUrl;
    }

    // 若已登录则直接进入系统，避免重复登录
    (async () => {
        try {
            const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
            if (res.ok) window.location.replace(safeNext());
        } catch (e) { /* 未登录，正常停留在登录页 */ }
    })();

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
            showMsg('请输入账号和密码');
            return;
        }

        btn.disabled = true;
        btn.textContent = '登录中...';
        msgBox.className = 'msg';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ username, password })
            });

            if (res.ok) {
                const data = await res.json();
                showMsg(`欢迎回来，${data.username}！正在进入系统...`, 'ok');
                window.location.replace(safeNext());
                return;
            }

            let detail = '登录失败，请重试';
            try {
                const err = await res.json();
                if (err && err.detail) detail = err.detail;
            } catch (e) { /* 忽略解析异常 */ }
            showMsg(detail);
        } catch (err) {
            showMsg('网络异常，无法连接服务器，请稍后重试');
        } finally {
            btn.disabled = false;
            btn.textContent = '登 录';
        }
    });
</script>
</body>
</html>
